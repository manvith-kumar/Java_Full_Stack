<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <style>
        form {
            height: 600px;
            width: 1200px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            background-image: url(https://www.bing.com/th/id/OIP.VJBtNuu9w9VWC843c4Q61gHaEw?w=193&h=135&c=8&rs=1&qlt=90&o=6&pid=ImgAns&rm=2);
        }

        legend {
            color: darkblue;
        }
    </style>
</head>

<body>

    <form action="">
        <fieldset>
            <legend align="center">Login Form</legend>

            <label for="username"> Username: </label>
            <input type="text" maxlength="10" placeholder="Enter username" id="username" required>
            <br><br>

            <label> Password : </label>
            <input minlength="6" type="password">
            <br><br>

            <label>Age: </label>
            <input type="number" min="18" max="40">
            <br><br>

            <button>Login</button>
            <br><br>

            <input type="submit">
            <button type="reset">Reset</button>
            <br><br>

        </fieldset>
    </form>

</body>
</html>
